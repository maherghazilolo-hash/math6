<html lang="ar" dir="rtl"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصتي التعليمية التفاعلية المخصصة</title>
    <style>
        :root { --bg-color: #0f172a; --text-main: #f8fafc; }
        body { font-family: 'Tahoma', sans-serif; background: linear-gradient(135deg, #1e1b4b, #0f172a); color: var(--text-main); margin: 0; padding: 15px; min-height: 100vh; box-sizing: border-box; }
        .container { max-width: 800px; margin: 0 auto; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(10px); padding: 12px 18px; border-radius: 16px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; box-shadow: 0 8px 32px rgba(0,0,0,0.3); flex-wrap: wrap; gap: 10px; }
        .admin-login-btn { background: #475569; color: white; border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.85rem; transition: background 0.2s; }
        .admin-login-btn.active { background: #10b981; }

        .reset-storage-btn { background: #ef4444; color: white; border: none; padding: 10px 14px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.85rem; width: 100%; margin-bottom: 15px; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); }

        .login-box-mobile { background: rgba(15, 23, 42, 0.95); padding: 15px; border-radius: 12px; border: 1px solid #475569; margin-bottom: 20px; display: none; gap: 8px; align-items: center; width: 100%; box-sizing: border-box; }
        .login-box-mobile input { padding: 8px 12px; background: #1e293b; border: 1px solid #64748b; color: white; border-radius: 8px; flex-grow: 1; font-size: 0.9rem; }
        .login-box-mobile button { padding: 8px 15px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .big-card { 
            border-radius: 20px; padding: 22px 20px; margin-bottom: 16px; cursor: pointer; color: white; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); display: flex; flex-direction: column; align-items: center; text-align: center; 
            transition: transform 0.2s ease, box-shadow 0.2s ease; border: 1px solid rgba(255,255,255,0.2); width: 100%; box-sizing: border-box;
            position: relative;
        }
        .big-card:active { transform: scale(0.98); }

        .gradient-1 { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        .gradient-2 { background: linear-gradient(135deg, #10b981, #047857); }
        .gradient-3 { background: linear-gradient(135deg, #f59e0b, #b45309); }
        .gradient-4 { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
        .gradient-5 { background: linear-gradient(135deg, #ec4899, #be185d); }
        .gradient-6 { background: linear-gradient(135deg, #06b6d4, #0e7490); }

        .card-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 5px; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        .card-subtitle { font-size: 0.9rem; opacity: 0.95; }

        .admin-action-row { display: flex; gap: 8px; margin-top: 12px; width: 100%; justify-content: center; }
        .delete-btn-card { background: rgba(0,0,0,0.4); color: white; border: 1px solid rgba(255,255,255,0.4); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }

        .back-btn { background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255,255,255,0.3); color: white; font-weight: bold; cursor: pointer; margin-bottom: 15px; font-size: 0.95rem; padding: 8px 16px; border-radius: 10px; backdrop-filter: blur(5px); }
        
        .admin-panel { background: rgba(30, 41, 59, 0.95); padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); color: #fff; }
        .admin-panel input, .admin-panel textarea { width: 100%; padding: 12px; margin: 6px 0 14px 0; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 10px; box-sizing: border-box; font-family: inherit; font-size: 0.95rem; }
        .admin-panel textarea { height: 180px; direction: ltr; text-align: left; font-family: monospace; font-size: 0.9rem; }

        .admin-btn { background: #10b981; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1rem; margin-bottom: 8px; }
        .export-btn { background: #2563eb; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1rem; }
        
        .header-title-box { background: linear-gradient(135deg, #4f46e5, #7c3aed); padding: 25px; border-radius: 20px; text-align: center; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 10px 30px rgba(79, 70, 229, 0.4); color: white; }
        .header-title-box h2 { margin: 0 0 5px 0; font-size: 1.5rem; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        .header-title-box p { margin: 0; opacity: 0.9; font-size: 0.95rem; }

        .code-viewer-container { width: 100%; height: 650px; background: white; border-radius: 16px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    </style>
</head>

    // دوال تشفير وفك تشفير الآدمية لحماية الأكواد على الموبايل من التلف
    function safeBtoa(str) {
        return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1) {
            return String.fromCharCode('0x' + p1);
        }));
    }

    function safeAtob(b64Str) {
        try {
            return decodeURIComponent(atob(b64Str).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
        } catch(e) {
            return b64Str; // إذا لم يكن مشفراً، يُعاد كما هو للاستبدال الآمن
        }

    let customPlatformData = defaultPlatformData;

    try {
        let saved = localStorage.getItem('customPlatformStorageSafe');
        if (saved) {
            let parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].name) {
                customPlatformData = parsed;
            } else {
                localStorage.removeItem('customPlatformStorageSafe');
            }
        }
    } catch(e) {
        localStorage.removeItem('customPlatformStorageSafe');
    }

    let currentView = 'chaptersList', selChap = 0, selTopic = 0;
    let isAdminMode = false;
    let showLoginBox = false;
    const ADMIN_PASS = "1234";

    let editingTopicIndex = null;

    function saveToStorage() {
        try {
            localStorage.setItem('customPlatformStorageSafe', JSON.stringify(customPlatformData));
        } catch(e) {}
        render();
    }

    function resetStorageData() {
        if (confirm('هل أنت متأكد من إعادة ضبط المصنع ومسح البيانات التالفة؟')) {
            localStorage.removeItem('customPlatformStorageSafe');
            customPlatformData = defaultPlatformData;
            isAdminMode = false;
            showLoginBox = false;
            currentView = 'chaptersList';
            render();
            alert('تم مسح الذاكرة وإعادة الضبط بنجاح!');
        }
    }

    function toggleAdminLogin() {
        if (isAdminMode) {
            isAdminMode = false;
            showLoginBox = false;
            render();
        } else {
            showLoginBox = !showLoginBox;
            render();
        }
    }

    function verifyMobilePassword() {
        let passInput = document.getElementById('mobile-admin-pass');
        if (passInput && passInput.value === ADMIN_PASS) {
            isAdminMode = true;
            showLoginBox = false;
            render();
        } else {
            alert("كلمة المرور غير صحيحة!");
        }
    }

    function exportFile() {
        let htmlContent = document.documentElement.outerHTML;
        let newScript = `let defaultPlatformData = ${JSON.stringify(customPlatformData, null, 4)};\n    let customPlatformData = defaultPlatformData;`;
        htmlContent = htmlContent.replace(/let defaultPlatformData = \[[\s\S]*?\];\s*let customPlatformData = defaultPlatformData;/, newScript);

        let blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        let url = URL.createObjectURL(blob);
        let a = document.createElement('a');
        a.href = url; a.download = 'index.html';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        alert('تم تصدير ملف المشروع البرمجي المحدث بالكامل بنجاح!');
    }

    function render() {
        const app = document.getElementById('app');
        if (!app) return;

        let topBar = `
            <div class="top-bar">
                <span>وضع العرض: <strong>${isAdminMode ? '🔓 وضع الإدارة (مفعل)' : '🔒 وضع الاستعراض (آمن)'}</strong></span>
                <button class="admin-login-btn ${isAdminMode ? 'active' : ''}" onclick="toggleAdminLogin()">
                    ${isAdminMode ? 'خروج من الإدارة 🔒' : 'دخول الإدارة ⚙️'}
                </button>
            </div>
            
            <div class="login-box-mobile" style="display: ${showLoginBox && !isAdminMode ? 'flex' : 'none'};">
                <input type="password" id="mobile-admin-pass" placeholder="أدخل كلمة المرور (1234)">
                <button onclick="verifyMobilePassword()">دخول</button>
            </div>
        `;

        if (isAdminMode) {
            topBar += `<button class="reset-storage-btn" onclick="resetStorageData()">🔄 إعادة ضبط المصنع (مسح الذاكرة التالفة)</button>`;
        }

        if (currentView === 'chaptersList') {
            let html = topBar + `
                <div class="header-title-box">
                    <h2>قائمة الفصول الدراسية</h2>
                    <p>اختر الفصل لتصفح المواضيع والأكواد التفاعلية</p>
                </div>`;
            
            customPlatformData.forEach((chap, idx) => {
                let grad = `gradient-${(idx % 6) + 1}`;
                html += `
                    <div class="big-card ${grad}" onclick="selChap=${idx}; currentView='topicsList'; render();">
                        <div class="card-title">📚 ${chap.name}</div>
                        <div class="card-subtitle">عدد المواضيع: ${chap.topics ? chap.topics.length : 0}</div>`;
                if (isAdminMode) {
                    html += `
                        <div class="admin-action-row" onclick="event.stopPropagation()">
                            <button class="delete-btn-card" onclick="deleteChapter(${idx})">حذف الفصل</button>
                        </div>`;
                }
                html += `</div>`;
            });

            if (isAdminMode) {
                html += `
                    <div class="admin-panel">
                        <h3>➕ إضافة فصل جديد</h3>
                        <input id="new-chap-name" placeholder="اسم الفصل الجديد (مثلاً: الفصل الثاني: الكسور)">
                        <button class="admin-btn" onclick="addChapter()">إضافة الفصل للمنصة</button>
                        <button class="export-btn" onclick="exportFile()">📥 تصدير الكود المحدث بالكامل كملف HTML</button>
                    </div>`;
            }
            app.innerHTML = html;
        }
        else if (currentView === 'topicsList') {
            let chap = customPlatformData[selChap];
            let html = topBar + `
                <button class="back-btn" onclick="currentView='chaptersList'; render();">← عودة لقائمة الفصول</button>
                <div class="header-title-box">
                    <h2>${chap.name}</h2>
                    <p>اختر الموضوع البرمجي أو التفاعلي للبدء</p>
                </div>`;

            if (chap.topics && chap.topics.length > 0) {
                chap.topics.forEach((top, idx) => {
                    let grad = `gradient-${(idx % 6) + 1}`;
                    html += `
                        <div class="big-card ${grad}" onclick="selTopic=${idx}; currentView='viewTopic'; render();">
                            <div class="card-title">💻 ${top.topName}</div>
                            <div class="card-subtitle">اضغط لتشغيل صفحة الكود التفاعلي</div>`;
                    if (isAdminMode) {
                        html += `
                            <div class="admin-action-row" onclick="event.stopPropagation()">
                                <button class="delete-btn-card" style="background:#f59e0b;" onclick="startEditTopic(${idx})">تعديل الموضوع</button>
                                <button class="delete-btn-card" onclick="deleteTopic(${idx})">حذف الموضوع</button>
                            </div>`;
                    }
                    html += `</div>`;
                });
            } else {
                html += `<p style="text-align:center; color:#94a3b8; background:rgba(30,41,59,0.9); padding:30px; border-radius:16px; border:1px solid rgba(255,255,255,0.1);">لا توجد مواضيع مضافة في هذا الفصل حتى الآن.</p>`;
            }

            if (isAdminMode) {
                let editingCodeDecoded = "";
                if (editingTopicIndex !== null) {
                    editingCodeDecoded = safeAtob(chap.topics[editingTopicIndex].htmlCode);
                }
                html += `
                    <div class="admin-panel">
                        <h3>${editingTopicIndex !== null ? '✏️ تعديل موضوع حالي' : '➕ إضافة موضوع جديد بكود HTML مخصص'}</h3>
                        <input id="form-top-name" value="${editingTopicIndex !== null ? chap.topics[editingTopicIndex].topName : ''}" placeholder="عنوان الموضوع (مثلاً: شرح وتدريب جمع الكسور)">
                        <textarea id="form-top-code" placeholder="الصق كود الـ HTML / CSS / JS الكامل هنا...">${escapeHtmlForTextarea(editingCodeDecoded)}</textarea>
                        <button class="admin-btn" onclick="saveTopicForm()">${editingTopicIndex !== null ? 'حفظ التعديلات' : 'إضافة الموضوع للفصل'}</button>
                        ${editingTopicIndex !== null ? '<button class="delete-btn-card" style="width:100%; padding:10px; margin-bottom:8px; background:#ef4444;" onclick="cancelEdit()">إلغاء التعديل</button>' : ''}
                        <button class="export-btn" onclick="exportFile()">📥 تصدير الكود المحدث بالكامل كملف HTML</button>
                    </div>`;
            }
            app.innerHTML = html;
        }
        else if (currentView === 'viewTopic') {
            let top = customPlatformData[selChap].topics[selTopic];
            let decodedHtml = safeAtob(top.htmlCode);
            let html = topBar + `
                <button class="back-btn" onclick="currentView='topicsList'; render();">← عودة لقائمة المواضيع</button>
                <div class="header-title-box" style="margin-bottom:12px;">
                    <h2>${top.topName}</h2>
                </div>`;

            // استخدام srcdoc مع فك التشفير الآمن تماماً لعرض أكواد الاختبارات الكبيرة والمعقدة على الموبايل
            html += `<iframe class="code-viewer-container" srcdoc="${escapeHtml(decodedHtml)}"></iframe>`;

            app.innerHTML = html;
        }
    }

    function escapeHtml(text) {
        return text.replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function escapeHtmlForTextarea(text) {
        return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function addChapter() {
        let name = document.getElementById('new-chap-name').value.trim();
        if (!name) { alert('يرجى كتابة اسم الفصل.'); return; }
        customPlatformData.push({ name: name, topics: [] });
        saveToStorage();
    }

    function deleteChapter(idx) {
        if (confirm('حذف الفصل سيقوم بحذف جميع المواضيع التابعة له. هل أنت متأكد؟')) {
            customPlatformData.splice(idx, 1);
            saveToStorage();
        }
    }

    function startEditTopic(idx) {
        editingTopicIndex = idx;
        render();
    }

    function cancelEdit() {
        editingTopicIndex = null;
        render();
    }

    function saveTopicForm() {
        let name = document.getElementById('form-top-name').value.trim();
        let rawCode = document.getElementById('form-top-code').value;
        if (!name || !rawCode) { alert('يرجى كتابة عنوان الموضوع وإلصاق الكود البرمجي.'); return; }

        let encodedCode = safeBtoa(rawCode);
        let chap = customPlatformData[selChap];
        if (!chap.topics) chap.topics = [];

        if (editingTopicIndex !== null) {
            chap.topics[editingTopicIndex].topName = name;
            chap.topics[editingTopicIndex].htmlCode = encodedCode;
            editingTopicIndex = null;
        } else {
            chap.topics.push({ topName: name, htmlCode: encodedCode });
        }
        saveToStorage();
    }

    function deleteTopic(idx) {
        if (confirm('هل أنت متأكد من حذف هذا الموضوع؟')) {
            customPlatformData[selChap].topics.splice(idx, 1);
            if (editingTopicIndex === idx) editingTopicIndex = null;
            saveToStorage();
        }
    }

    render();
</script>

</body></html>
